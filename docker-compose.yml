services:
  emulators:
    build:
      context: .
      dockerfile: docker/emulators.Dockerfile
      args:
        FIREBASE_TOOLS_VERSION: "15.32.1"
    volumes:
      - .:/workspace
      # Named volume at a *parent* path; entrypoint exports to /data/export.
      # Mounting the volume directly on the export dir makes firebase-tools
      # rmSync hit EBUSY and wipe data on every stop (see PR review M1).
      # Wipe intentionally with `docker compose down -v`.
      - emulator-data:/data
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9099:9099"
      - "127.0.0.1:9150:9150"
    # export-on-exit needs time after SIGTERM before the container is killed
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:4000 >/dev/null && curl -fsS http://127.0.0.1:9099 >/dev/null && curl -fsS http://127.0.0.1:8080 >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Optional full-stack path. Default `docker compose up` is backend-only so
  # host `pnpm dev` can own :3000 without a port clash.
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /app
    # Match the host user so bind-mounted `.next` is writable (default 1000:1000).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - .:/app
      # Anonymous volume: seeded from the image on first create. After lockfile
      # changes, refresh with `docker compose --profile app up --build --renew-anon-volumes`
      # (or `docker compose down` then up --build). Named volumes silently keep stale modules.
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:3000
      FIREBASE_PROJECT_ID: demo-prosefield
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-prosefield
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
      FIRESTORE_EMULATOR_HOST: emulators:8080
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      ALLOW_EMULATORS: "1"
      # Dev KEK (32× 0x07 base64) — never a production secret; Compose-owned.
      DOCUMENT_ENCRYPTION_PROVIDER: dev
      DOCUMENT_ENCRYPTION_KEY_VERSION: "1"
      DOCUMENT_ENCRYPTION_KEK: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    depends_on:
      emulators:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 60s

  stripe-cli:
    profiles: ["stripe"]
    # Pin by tag + digest (not :latest). STRIPE_API_KEY is what the CLI reads;
    # map it from STRIPE_SECRET_KEY in .env so `docker compose run --rm stripe-cli listen --print-secret` works.
    image: stripe/stripe-cli:v1.53.0@sha256:92dbb87a9342196d6b4c0aa305ef8d0cacc1edd81da12f1e819ed78e9e99bead
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
    command:
      - listen
      - --forward-to
      - app:3000/api/stripe/webhook
    # Webhook forwarding needs the `app` profile (or host networking).
    # No depends_on so `docker compose run --rm stripe-cli listen --print-secret` works alone.

volumes:
  emulator-data:
