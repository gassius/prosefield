name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build, unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Prepare example env for build
        run: cp .env.example .env

      - name: Build
        run: pnpm build

  compose:
    name: Compose and YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Strict YAML parse
        run: |
          python3 -m pip install --user pyyaml
          python3 - <<'PY'
          import yaml
          for path in (
              "docker-compose.yml",
              ".github/workflows/ci.yml",
          ):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"ok: {path}")
          PY

      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile stripe config -q

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # gitleaks/gitleaks-action@v2
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run actionlint
        # rhysd/actionlint:1.7.7
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

