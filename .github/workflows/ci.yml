name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build, unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Prepare example env for build
        run: cp .env.example .env

      - name: Build
        # .env.example leaves ALLOW_EMULATORS commented (fail-closed default).
        # Local/CI builds against demo emulator hosts must opt in explicitly.
        env:
          ALLOW_EMULATORS: "1"
        run: pnpm build

  integration:
    name: Auth integration (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare example env
        run: cp .env.example .env

      - name: Start emulators
        run: docker compose up -d --wait

      - name: Emulator ports respond
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4000 >/dev/null
          curl -fsS http://127.0.0.1:9099 >/dev/null
          curl -fsS http://127.0.0.1:8080 >/dev/null
          echo "ok: Auth/Firestore emulator ports healthy"

      - name: Stop emulators
        if: always()
        run: docker compose down -v

  # Exact name required by branch protection (do not rename).
  component:
    name: Component + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare example env
        run: cp .env.example .env

      - name: Start emulators
        run: docker compose up -d --wait

      - name: Component tests
        run: pnpm test:component

      - name: Coverage thresholds (unit + component + integration)
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          APP_URL: http://localhost:3000
        run: pnpm test:coverage

      - name: Stop emulators
        if: always()
        run: docker compose down -v
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        # actions/cache@v4
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare example env
        run: cp .env.example .env

      - name: Build
        env:
          ALLOW_EMULATORS: "1"
        run: pnpm build

      - name: Start Next.js (backend down)
        env:
          APP_URL: http://localhost:3000
          ALLOW_EMULATORS: "1"
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 &
          echo $! > /tmp/next.pid
          bash scripts/wait-for-url.sh http://localhost:3000/api/health 90

      - name: E2E offline landing
        env:
          APP_URL: http://localhost:3000
        run: pnpm test:e2e:offline

      - name: Start emulators
        run: docker compose up -d --wait

      - name: E2E + accessibility
        env:
          APP_URL: http://localhost:3000
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_PROJECT_ID: demo-prosefield
        run: pnpm exec playwright test --project=e2e --project=a11y --grep-invert @offline

      - name: Upload Playwright report
        if: failure()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Next.js
        if: always()
        run: |
          if [ -f /tmp/next.pid ]; then kill "$(cat /tmp/next.pid)" || true; fi

      - name: Stop emulators
        if: always()
        run: docker compose down -v

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare example env
        run: cp .env.example .env

      # Image pull is left to scripts/test-visual.sh (single source of truth for
      # version+digest). Tar-caching the digest-pinned image was a net slowdown.

      - name: Start emulators
        run: docker compose up -d --wait
      - name: Build
        env:
          ALLOW_EMULATORS: "1"
        run: pnpm build

      - name: Start Next.js
        env:
          APP_URL: http://localhost:3000
          ALLOW_EMULATORS: "1"
        run: |
          set -euo pipefail
          # Assemble non-placeholder Stripe fixtures for visual finding 18
          # (configured /subscribe checkout). Join prefix+body so the workflow
          # never contains a contiguous sk_test_/whsec_ value (gitleaks
          # stripe-access-token). Distinct from *_replaceme localDevDefaults.
          # No real Stripe calls — prices.retrieve hits a local mock, not
          # api.stripe.com. Visual tests do not click Checkout.
          SK_PREFIX='sk_test'
          SK_BODY='visualbaseline01'
          export STRIPE_SECRET_KEY="${SK_PREFIX}_${SK_BODY}"
          WH_PREFIX='whsec'
          WH_BODY='visualbaseline01'
          export STRIPE_WEBHOOK_SECRET="${WH_PREFIX}_${WH_BODY}"
          export STRIPE_PRICE_ID='price_visualbaseline01'
          export STRIPE_API_HOST='127.0.0.1'
          export STRIPE_API_PORT='12111'
          export STRIPE_API_PROTOCOL='http'
          node scripts/stripe-prices-mock-server.mjs &
          echo $! > /tmp/stripe-mock.pid
          pnpm start --hostname 127.0.0.1 --port 3000 &
          echo $! > /tmp/next.pid
          bash scripts/wait-for-url.sh http://localhost:3000/api/health 90

      - name: Visual regression (Playwright Docker)
        env:
          APP_URL: http://localhost:3000
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_PROJECT_ID: demo-prosefield
          CI: "1"
        run: pnpm test:visual

      - name: Upload visual diff artifacts
        if: failure()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
            e2e/**/*-snapshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Next.js
        if: always()
        run: |
          if [ -f /tmp/next.pid ]; then kill "$(cat /tmp/next.pid)" || true; fi
          if [ -f /tmp/stripe-mock.pid ]; then kill "$(cat /tmp/stripe-mock.pid)" || true; fi

      - name: Stop emulators
        if: always()
        run: docker compose down -v

  compose:
    name: Compose and YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Strict YAML parse
        run: |
          python3 -m pip install --user pyyaml
          python3 - <<'PY'
          import yaml
          for path in (
              "docker-compose.yml",
              ".github/workflows/ci.yml",
          ):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"ok: {path}")
          PY

      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile stripe config -q

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: shellcheck bash scripts
        # koalaman/shellcheck:v0.11.0 pinned by digest. Glob so new scripts/*.sh are covered.
        run: |
          set -euo pipefail
          files=(scripts/*.sh docker/*.sh)
          docker run --rm -v "$PWD:/src" -w /src \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -x "${files[@]}"

  # macOS: exercise set -m / perl launch, lsof cwd, bash 3.2, BSD ps (no Docker).
  ship-scripts-macos:
    name: Ship scripts (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ship-scripts unit tests
        run: pnpm exec vitest run tests/unit/ship-scripts.test.ts

  fresh-start:
    name: Fresh machine start
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          # No cache:pnpm — timing must include a cold store download.

      - name: Timed check + clean start (idempotent)
        env:
          APP_URL: http://localhost:3000
          # Force an empty pnpm store for honest cold-install timing.
          npm_config_store_dir: ${{ runner.temp }}/pnpm-store-empty
        run: |
          set -euo pipefail
          mkdir -p "${npm_config_store_dir}"
          start_ts=$(date +%s)
          bash scripts/check.sh
          # Clean start path: no prior node_modules / .env / compose.
          rm -rf node_modules .env .prosefield-dev.pid .prosefield-dev.log
          docker compose --env-file .env.example down -v >/dev/null 2>&1 || true
          bash scripts/start.sh
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          test "$code" = "200"
          # Emulator ports must be up (not just the landing page).
          curl -fsS http://127.0.0.1:9099 >/dev/null
          curl -fsS http://127.0.0.1:8080 >/dev/null
          curl -fsS http://127.0.0.1:4000 >/dev/null
          # Idempotence: second start must succeed while stack is already up.
          bash scripts/start.sh
          code2=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          test "$code2" = "200"
          curl -fsS http://127.0.0.1:9099 >/dev/null
          curl -fsS http://127.0.0.1:8080 >/dev/null
          end_ts=$(date +%s)
          elapsed=$((end_ts - start_ts))
          echo "Fresh start elapsed_seconds=${elapsed}"
          if [ "$elapsed" -gt 900 ]; then
            echo "::error::Fresh start took ${elapsed}s (>15 min budget)"
            exit 1
          fi

      - name: Stop stack and assert ports closed
        if: always()
        run: |
          set -euo pipefail
          bash scripts/stop.sh
          test ! -f .prosefield-dev.pid
          port_closed() {
            local port="$1"
            if command -v ss >/dev/null 2>&1; then
              if ss -ltn "( sport = :${port} )" 2>/dev/null | grep -q ":${port}"; then
                return 1
              fi
              return 0
            fi
            if (echo >/dev/tcp/127.0.0.1/"$port") >/dev/null 2>&1; then
              return 1
            fi
            return 0
          }
          for port in 3000 4000 8080 9099; do
            if ! port_closed "$port"; then
              echo "::error::port ${port} still open after scripts/stop.sh"
              exit 1
            fi
            echo "ok: port ${port} closed"
          done
          # Fail if compose itself errors (no vacuous || true).
          compose_ids="$(docker compose ps -q)"
          if [[ -n "$compose_ids" ]]; then
            echo "::error::docker compose still has running services after scripts/stop.sh"
            docker compose ps
            exit 1
          fi
          echo "ok: docker compose ps empty"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # gitleaks/gitleaks-action@v2
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run actionlint
        # rhysd/actionlint:1.7.7
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  commit-trailers:
    name: Commit trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify agent commit trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          agents_md=$(git show "${BASE_SHA}:AGENTS.md")
          mapfile -t KNOWN < <(
            printf '%s\n' "$agents_md" \
              | sed -n '/^### Known identities$/,/^### /p' \
              | sed -n 's/^- \*\*\([^*]*\)\*\*.*/\1/p'
          )
          if [ "${#KNOWN[@]}" -eq 0 ]; then
            echo "::error::Failed to load Known identities from ${BASE_SHA}:AGENTS.md"
            exit 1
          fi
          echo "Known identities (from ${BASE_SHA}): ${KNOWN[*]}"

          is_known() {
            local agent="$1"
            local name
            for name in "${KNOWN[@]}"; do
              if [ "$name" = "$agent" ]; then
                return 0
              fi
            done
            return 1
          }

          # Returns: parents\tcommitter_login\tauthor_login\tauthor_email\tverified (true/false)
          github_commit_meta() {
            local sha="$1"
            gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" \
              --jq '[(.parents|length), (.committer.login // ""), (.author.login // ""), (.commit.author.email // ""), (.commit.verification.verified|tostring)] | @tsv'
          }

          has_agent_lines() {
            local msg="$1"
            printf '%s\n' "$msg" | grep -Eq '^Agent(-[A-Za-z]+)?:'
          }

          failed=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue

            subject=$(git log -1 --format='%s' "$sha")
            msg=$(git log -1 --format='%B' "$sha")

            meta=$(github_commit_meta "$sha")
            IFS=$'\t' read -r api_parents committer_login author_login author_email verified <<<"$meta"
            verified=${verified:-false}
            api_parents=${api_parents:-0}
            author_email=${author_email:-}

            # Exemptions only when the message has no Agent* lines (agents can't forge web-flow / verified gassius).
            if ! has_agent_lines "$msg"; then
              if [ "$api_parents" -ge 2 ] \
                && [ "$committer_login" = "web-flow" ] \
                && [ "$verified" = "true" ]; then
                echo "skip: ${sha} (GitHub merge, web-flow verified)"
                continue
              fi
              if [ "$verified" = "true" ] && [ "$committer_login" = "gassius" ]; then
                echo "skip: ${sha} (Carlos, verified committer gassius)"
                continue
              fi
              if [ "$verified" = "true" ] \
                && [ "$committer_login" = "web-flow" ] \
                && [ "$author_login" = "gassius" ]; then
                echo "skip: ${sha} (Carlos, verified web-flow author gassius)"
                continue
              fi
              # Carlos manual pushes: GitHub author login gassius + author email.
              if COMMIT_MESSAGE="$msg" \
                bash scripts/commit-trailer-carlos-exempt.sh \
                  "$author_login" "$author_email" "$sha"
              then
                continue
              fi
            fi

            parsed=$(printf '%s\n' "$msg" | git interpret-trailers --parse || true)

            agent=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent" { print substr($0, index($0,": ")+2); exit }')
            ticket=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent-Ticket" { print substr($0, index($0,": ")+2); exit }')
            run=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent-Run" { print substr($0, index($0,": ")+2); exit }')
            agent_count=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent" { c++ } END { print c+0 }')
            run_count=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent-Run" { c++ } END { print c+0 }')
            ticket_count=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent-Ticket" { c++ } END { print c+0 }')

            reasons=()
            if [ -z "$parsed" ]; then
              reasons+=("git interpret-trailers --parse produced no trailer block")
            fi
            if [ "$agent_count" -ne 1 ]; then
              reasons+=("expected exactly one Agent trailer in the single trailer block (found ${agent_count})")
            fi
            if [ "$ticket_count" -ne 1 ]; then
              reasons+=("expected exactly one Agent-Ticket trailer (found ${ticket_count})")
            fi
            if [ "$run_count" -ne 1 ]; then
              reasons+=("expected exactly one Agent-Run trailer (found ${run_count})")
            fi
            if [ -z "$agent" ]; then
              reasons+=("missing required Agent trailer")
            elif ! is_known "$agent"; then
              reasons+=("Agent '${agent}' is not a Known identity from base AGENTS.md")
            fi
            if [ -z "$ticket" ]; then
              reasons+=("missing required Agent-Ticket trailer")
            elif ! printf '%s\n' "$ticket" | grep -Eq '^(none|[0-9a-z]{9}|#[0-9]+|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+)$'; then
              reasons+=("Agent-Ticket '${ticket}' must be a ClickUp id, none, or a GitHub issue/PR reference")
            fi
            if [ -z "$run" ]; then
              reasons+=("missing required Agent-Run trailer")
            elif ! printf '%s\n' "$run" | grep -Eq '^https://cursor\.com/agents/bc-[0-9a-f-]{36}$|^hermes-session:[^[:space:]]+$'; then
              reasons+=("Agent-Run '${run}' must be https://cursor.com/agents/bc-… or hermes-session:<id>")
            fi

            if [ "${#reasons[@]}" -gt 0 ]; then
              failed=1
              echo "::error title=Bad commit trailers::${sha} (${subject})"
              echo "Commit ${sha} failed trailer checks:"
              printf '  - %s\n' "${reasons[@]}"
              echo "Parsed trailers:"
              if [ -n "$parsed" ]; then
                printf '%s\n' "$parsed" | sed 's/^/  /'
              else
                echo "  (empty)"
              fi
              echo "GitHub meta: parents=${api_parents} committer=${committer_login} author=${author_login} email=${author_email} verified=${verified}"
              echo
            else
              echo "ok: ${sha} Agent=${agent} Agent-Ticket=${ticket}"
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more commits are missing a valid single Agent / Agent-Ticket / Agent-Run trailer block."
            exit 1
          fi
          echo "All commits in ${BASE_SHA}..${HEAD_SHA} have valid trailers or an allowed exemption."

  no-host-java:
    name: No host Java / native emulators
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard against host Java and native emulator scripts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          # Patterns intentionally live only in this excluded workflow file and docker/.
          JAVA_RE = re.compile(r"(?i)(^|[^a-z0-9])java([^a-z0-9]|$)")
          EMU_RE = re.compile(r"(?i)firebase\b[^\n]*\bemulators:(start|exec)\b")
          WORKFLOW = Path(".github/workflows/ci.yml")
          failed = False

          def is_under_docker_dir(path: str) -> bool:
              # Real docker/ only — not docker-foo/
              return path == "docker" or path.startswith("docker/")

          def is_binary(data: bytes) -> bool:
              return b"\x00" in data[:8192]

          pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))
          for section in ("dependencies", "devDependencies"):
              deps = pkg.get(section) or {}
              if "firebase-tools" in deps:
                  print(
                      f"::error file=package.json::firebase-tools must not appear in {section} "
                      "(image-only; see docker/emulators.Dockerfile)"
                  )
                  failed = True

          scripts = pkg.get("scripts") or {}
          for name, cmd in scripts.items():
              text = f"{name}={cmd}"
              if JAVA_RE.search(cmd) or EMU_RE.search(cmd):
                  print(f"::error file=package.json::Forbidden pattern in script: {text}")
                  failed = True

          listed = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.split(b"\x00")

          for raw in listed:
              if not raw:
                  continue
              path = raw.decode("utf-8", errors="surrogateescape")
              if is_under_docker_dir(path):
                  continue
              if path == str(WORKFLOW) or path == WORKFLOW.as_posix():
                  continue
              if path == "pnpm-lock.yaml":
                  continue

              try:
                  data = Path(path).read_bytes()
              except OSError as exc:
                  print(f"::error file={path}::Failed to read file: {exc}")
                  failed = True
                  continue

              if is_binary(data):
                  continue

              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  # Non-UTF8 text still scanned via latin-1 so we never skip quietly
                  text = data.decode("latin-1")

              for lineno, line in enumerate(text.splitlines(), start=1):
                  if JAVA_RE.search(line):
                      print(
                          f"::error file={path},line={lineno}::Forbidden host Java reference"
                      )
                      print(f"{path}:{lineno}:{line}")
                      failed = True
                  if EMU_RE.search(line):
                      print(
                          f"::error file={path},line={lineno}::Forbidden host firebase emulators:(start|exec)"
                      )
                      print(f"{path}:{lineno}:{line}")
                      failed = True

          if failed:
              print("::error::Host Java / native emulator references found outside docker/.")
              sys.exit(1)
          print("ok: no host Java, no host firebase-tools, no native emulator CLI outside docker/")
          PY

