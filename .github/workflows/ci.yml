name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build, unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Prepare example env for build
        run: cp .env.example .env

      - name: Build
        run: pnpm build

  compose:
    name: Compose and YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Strict YAML parse
        run: |
          python3 -m pip install --user pyyaml
          python3 - <<'PY'
          import yaml
          for path in (
              "docker-compose.yml",
              ".github/workflows/ci.yml",
          ):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"ok: {path}")
          PY

      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile stripe config -q

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # gitleaks/gitleaks-action@v2
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run actionlint
        # rhysd/actionlint:1.7.7
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  commit-trailers:
    name: Commit trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify agent commit trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          agents_md=$(git show "${BASE_SHA}:AGENTS.md")
          mapfile -t KNOWN < <(
            printf '%s\n' "$agents_md" \
              | sed -n '/^### Known identities$/,/^### /p' \
              | sed -n 's/^- \*\*\([^*]*\)\*\*.*/\1/p'
          )
          if [ "${#KNOWN[@]}" -eq 0 ]; then
            echo "::error::Failed to load Known identities from ${BASE_SHA}:AGENTS.md"
            exit 1
          fi
          echo "Known identities (from ${BASE_SHA}): ${KNOWN[*]}"

          is_known() {
            local agent="$1"
            local name
            for name in "${KNOWN[@]}"; do
              if [ "$name" = "$agent" ]; then
                return 0
              fi
            done
            return 1
          }

          # Returns: parents\tcommitter_login\tauthor_login\tverified (true/false)
          github_commit_meta() {
            local sha="$1"
            gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" \
              --jq '[(.parents|length), (.committer.login // ""), (.author.login // ""), (.commit.verification.verified|tostring)] | @tsv'
          }

          has_agent_lines() {
            local msg="$1"
            printf '%s\n' "$msg" | grep -Eq '^Agent(-[A-Za-z]+)?:'
          }

          failed=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue

            subject=$(git log -1 --format='%s' "$sha")
            msg=$(git log -1 --format='%B' "$sha")

            meta=$(github_commit_meta "$sha")
            IFS=$'\t' read -r api_parents committer_login author_login verified <<<"$meta"
            verified=${verified:-false}
            api_parents=${api_parents:-0}

            # Exemptions only when the message has no Agent* lines (agents can't forge web-flow / verified gassius).
            if ! has_agent_lines "$msg"; then
              if [ "$api_parents" -ge 2 ] \
                && [ "$committer_login" = "web-flow" ] \
                && [ "$verified" = "true" ]; then
                echo "skip: ${sha} (GitHub merge, web-flow verified)"
                continue
              fi
              if [ "$verified" = "true" ] && [ "$committer_login" = "gassius" ]; then
                echo "skip: ${sha} (Carlos, verified committer gassius)"
                continue
              fi
              if [ "$verified" = "true" ] \
                && [ "$committer_login" = "web-flow" ] \
                && [ "$author_login" = "gassius" ]; then
                echo "skip: ${sha} (Carlos, verified web-flow author gassius)"
                continue
              fi
            fi

            parsed=$(printf '%s\n' "$msg" | git interpret-trailers --parse || true)

            agent=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent" { print substr($0, index($0,": ")+2); exit }')
            ticket=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent-Ticket" { print substr($0, index($0,": ")+2); exit }')
            run=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent-Run" { print substr($0, index($0,": ")+2); exit }')
            agent_count=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent" { c++ } END { print c+0 }')
            run_count=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent-Run" { c++ } END { print c+0 }')
            ticket_count=$(printf '%s\n' "$parsed" | awk -F': ' '$1=="Agent-Ticket" { c++ } END { print c+0 }')

            reasons=()
            if [ -z "$parsed" ]; then
              reasons+=("git interpret-trailers --parse produced no trailer block")
            fi
            if [ "$agent_count" -ne 1 ]; then
              reasons+=("expected exactly one Agent trailer in the single trailer block (found ${agent_count})")
            fi
            if [ "$ticket_count" -ne 1 ]; then
              reasons+=("expected exactly one Agent-Ticket trailer (found ${ticket_count})")
            fi
            if [ "$run_count" -ne 1 ]; then
              reasons+=("expected exactly one Agent-Run trailer (found ${run_count})")
            fi
            if [ -z "$agent" ]; then
              reasons+=("missing required Agent trailer")
            elif ! is_known "$agent"; then
              reasons+=("Agent '${agent}' is not a Known identity from base AGENTS.md")
            fi
            if [ -z "$ticket" ]; then
              reasons+=("missing required Agent-Ticket trailer")
            elif ! printf '%s\n' "$ticket" | grep -Eq '^(none|[0-9a-z]{9}|#[0-9]+|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+)$'; then
              reasons+=("Agent-Ticket '${ticket}' must be a ClickUp id, none, or a GitHub issue/PR reference")
            fi
            if [ -z "$run" ]; then
              reasons+=("missing required Agent-Run trailer")
            elif ! printf '%s\n' "$run" | grep -Eq '^https://cursor\.com/agents/bc-[0-9a-f-]{36}$|^hermes-session:[^[:space:]]+$'; then
              reasons+=("Agent-Run '${run}' must be https://cursor.com/agents/bc-… or hermes-session:<id>")
            fi

            if [ "${#reasons[@]}" -gt 0 ]; then
              failed=1
              echo "::error title=Bad commit trailers::${sha} (${subject})"
              echo "Commit ${sha} failed trailer checks:"
              printf '  - %s\n' "${reasons[@]}"
              echo "Parsed trailers:"
              if [ -n "$parsed" ]; then
                printf '%s\n' "$parsed" | sed 's/^/  /'
              else
                echo "  (empty)"
              fi
              echo "GitHub meta: parents=${api_parents} committer=${committer_login} author=${author_login} verified=${verified}"
              echo
            else
              echo "ok: ${sha} Agent=${agent} Agent-Ticket=${ticket}"
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more commits are missing a valid single Agent / Agent-Ticket / Agent-Run trailer block."
            exit 1
          fi
          echo "All commits in ${BASE_SHA}..${HEAD_SHA} have valid trailers or an allowed exemption."

  no-host-java:
    name: No host Java / native emulators
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard against host Java and native emulator scripts
        run: |
          set -euo pipefail
          failed=0

          # package.json scripts must not invoke the native emulator CLI
          if python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          scripts = json.loads(Path("package.json").read_text(encoding="utf-8")).get("scripts", {})
          bad = []
          for name, cmd in scripts.items():
              text = f"{name}={cmd}"
              if "firebase emulators:start" in cmd:
                  bad.append(text)
              if __import__("re").search(r"(?i)\bjava\b", cmd):
                  bad.append(text)
          if bad:
              print("Forbidden patterns in package.json scripts:")
              for item in bad:
                  print(f"  - {item}")
              sys.exit(1)
          print("ok: package.json scripts")
          PY
          then
            :
          else
            failed=1
          fi

          # README + docs: forbid host-Java guidance and native emulator start
          # outside docker/. Skip non-text files (e.g. images under docs/).
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              docker/*) continue ;;
              *.md|*.mdx|*.json|*.yml|*.yaml|*.ts|*.tsx|*.js|*.mjs|*.cjs|*.sh) ;;
              *) continue ;;
            esac
            if grep -nEiq '\bjava\b' "$path"; then
              echo "::error file=${path}::Forbidden word 'java' outside docker/ (use Docker-only backend wording)"
              grep -nEi '\bjava\b' "$path" || true
              failed=1
            fi
            if grep -nF 'firebase emulators:start' "$path"; then
              echo "::error file=${path}::Forbidden 'firebase emulators:start' outside docker/"
              failed=1
            fi
          done < <(git ls-files 'README.md' 'docs' 'package.json')

          if [ "$failed" -ne 0 ]; then
            echo "::error::Host Java / native emulator references found outside docker/."
            exit 1
          fi
          echo "ok: no host Java or native emulator start outside docker/"

